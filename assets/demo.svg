<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Animation: double-tap Right Alt, the screen dims, drag over Bangla and English text, Gemini reads it, it is copied to the clipboard and pasted with Ctrl+V">
  <style>
    .ui   { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .bn   { font-family: "Nirmala UI", "Noto Sans Bengali", "Vrinda", "Segoe UI", sans-serif; }
    .a { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }

    /* Right Alt: two quick taps */
    .key  { animation-name: key; }
    @keyframes key { 0%,4% {transform: translateY(0)} 5% {transform: translateY(5px)} 6%,8% {transform: translateY(0)} 9% {transform: translateY(5px)} 10%,100% {transform: translateY(0)} }
    .lit  { animation-name: lit; }
    @keyframes lit { 0%,4% {opacity: 0} 5% {opacity: 1} 6.5%,8% {opacity: 0} 9% {opacity: 1} 10.5%,100% {opacity: 0} }
    .x2 { animation-name: x2; }
    @keyframes x2 { 0%,8% {opacity: 0} 9.5%,26% {opacity: 1} 29%,100% {opacity: 0} }

    /* Dim screen + clear selection */
    .dim  { animation-name: dim; }
    @keyframes dim { 0%,11% {opacity: 0} 13%,29% {opacity: 1} 31%,100% {opacity: 0} }
    .sel  { animation-name: sel; transform-box: fill-box; transform-origin: left top; }
    @keyframes sel { 0%,14% {opacity: 0; transform: scale(0.02)} 15% {opacity: 1; transform: scale(0.02)} 27% {opacity: 1; transform: scale(1)} 29% {opacity: 1; transform: scale(1)} 31%,100% {opacity: 0; transform: scale(1)} }
    .cur  { animation-name: cur; }
    @keyframes cur { 0%,14% {opacity: 0; transform: translate(0,0)} 15% {opacity: 1; transform: translate(0,0)} 27%,29% {opacity: 1; transform: translate(244px,80px)} 31%,100% {opacity: 0; transform: translate(244px,80px)} }

    .tipR { animation-name: tipR; }
    @keyframes tipR { 0%,30% {opacity: 0} 32%,46% {opacity: 1} 48%,100% {opacity: 0} }
    .clip { animation-name: clip; }
    @keyframes clip { 0%,47% {opacity: 0; transform: translateY(8px)} 50%,94% {opacity: 1; transform: translateY(0)} 98%,100% {opacity: 0} }
    .tipC { animation-name: tipC; }
    @keyframes tipC { 0%,48% {opacity: 0} 50%,62% {opacity: 1} 64%,100% {opacity: 0} }
    .ctrlv { animation-name: ctrlv; }
    @keyframes ctrlv { 0%,66% {opacity: 0} 68%,76% {opacity: 1} 79%,100% {opacity: 0} }
    .paste { animation-name: paste; }
    @keyframes paste { 0%,72% {opacity: 0} 74%,94% {opacity: 1} 98%,100% {opacity: 0} }

    .cap1 { animation-name: cap1; } @keyframes cap1 { 0%,2% {opacity: 0} 4%,28% {opacity: 1} 30%,100% {opacity: 0} }
    .cap2 { animation-name: cap2; } @keyframes cap2 { 0%,30% {opacity: 0} 32%,46% {opacity: 1} 48%,100% {opacity: 0} }
    .cap3 { animation-name: cap3; } @keyframes cap3 { 0%,48% {opacity: 0} 50%,64% {opacity: 1} 66%,100% {opacity: 0} }
    .cap4 { animation-name: cap4; } @keyframes cap4 { 0%,66% {opacity: 0} 68%,94% {opacity: 1} 97%,100% {opacity: 0} }

    @media (prefers-reduced-motion: reduce) {
      .a { animation: none !important; }
      .lit, .x2, .dim, .sel, .cur, .tipR, .tipC, .ctrlv, .cap2, .cap3, .cap4 { opacity: 0; }
    }
  </style>

  <rect width="800" height="380" rx="18" fill="#0f172a"/>

  <!-- Right Alt key -->
  <g class="ui">
    <rect x="30" y="160" width="58" height="52" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="59" y="191" text-anchor="middle" font-size="13" fill="#64748b">Space</text>
    <g class="a key">
      <rect x="96" y="160" width="76" height="52" rx="9" fill="#334155" stroke="#64748b"/>
      <rect class="a lit" x="96" y="160" width="76" height="52" rx="9" fill="#2563eb"/>
      <text x="134" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">Right</text>
      <text x="134" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">Alt</text>
    </g>
    <g class="a x2"><circle cx="160" cy="146" r="16" fill="#22c55e"/><text x="160" y="151" text-anchor="middle" font-size="13" font-weight="800" fill="#052e16">×2</text></g>
  </g>

  <!-- Source: any text on screen (e.g. an image or PDF) -->
  <rect x="196" y="40" width="282" height="236" rx="10" fill="#f8fafc"/>
  <path d="M196 50 a10 10 0 0 1 10 -10 h262 a10 10 0 0 1 10 10 v14 h-282 z" fill="#e2e8f0"/>
  <text x="212" y="57" class="ui" font-size="12" fill="#475569">photo.jpg</text>
  <text x="222" y="120" class="ui" font-size="20" font-weight="600" fill="#0f172a">Meeting at 5 PM</text>
  <text x="222" y="158" class="bn" font-size="22" fill="#0f172a">আমার সোনার বাংলা</text>
  <rect x="222" y="190" width="200" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="222" y="208" width="160" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="222" y="226" width="180" height="8" rx="4" fill="#cbd5e1"/>
  <!-- Dim screen; the dragged area clears -->
  <rect class="a dim" x="196" y="40" width="282" height="236" rx="10" fill="#000000" fill-opacity="0.5"/>
  <rect class="a sel" x="212" y="94" width="244" height="80" fill="#f8fafc" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
  <g class="a cur"><path d="M212 84 v20 M202 94 h20" stroke="#ffffff" stroke-width="2"/></g>
  <g class="a tipR">
    <rect x="300" y="236" width="128" height="30" rx="6" fill="#fefce8" stroke="#a16207" stroke-opacity="0.4"/>
    <text x="364" y="256" text-anchor="middle" class="ui" font-size="14" font-weight="600" fill="#1e293b">Reading text...</text>
  </g>

  <!-- Arrow -->
  <path d="M488 158 H 512" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M505 150 L514 158 L505 166" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clipboard -->
  <rect x="522" y="40" width="250" height="108" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="538" y="64" class="ui" font-size="12" font-weight="700" fill="#94a3b8">📋 CLIPBOARD</text>
  <g class="a clip">
    <text x="538" y="96" class="ui" font-size="15" fill="#f8fafc">Meeting at 5 PM</text>
    <text x="538" y="122" class="bn" font-size="16" fill="#f8fafc">আমার সোনার বাংলা</text>
  </g>
  <g class="a tipC">
    <rect x="676" y="50" width="84" height="26" rx="6" fill="#fefce8" stroke="#a16207" stroke-opacity="0.4"/>
    <text x="718" y="68" text-anchor="middle" class="ui" font-size="13" font-weight="600" fill="#1e293b">Copied</text>
  </g>

  <!-- Any app: paste -->
  <rect x="522" y="160" width="250" height="116" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="538" y="184" class="ui" font-size="12" font-weight="700" fill="#94a3b8">ANY APP</text>
  <rect x="534" y="196" width="226" height="68" rx="8" fill="#0b1220" stroke="#334155"/>
  <g class="a paste">
    <text x="546" y="222" class="ui" font-size="14" fill="#f8fafc">Meeting at 5 PM</text>
    <text x="546" y="248" class="bn" font-size="15" fill="#f8fafc">আমার সোনার বাংলা</text>
  </g>
  <g class="a ctrlv">
    <rect x="652" y="226" width="96" height="30" rx="8" fill="#a855f7"/>
    <text x="700" y="246" text-anchor="middle" class="ui" font-size="14" font-weight="800" fill="#faf5ff">Ctrl + V</text>
  </g>

  <!-- Captions -->
  <g class="ui" font-size="21" font-weight="700" text-anchor="middle" fill="#f8fafc">
    <text class="a cap1" x="400" y="330">Double-tap <tspan fill="#60a5fa">Right Alt</tspan>  →  drag over any text</text>
    <text class="a cap2" x="400" y="330">Gemini reads it — <tspan fill="#4ade80">any language</tspan></text>
    <text class="a cap3" x="400" y="330"><tspan fill="#c084fc">Copied</tspan> to your clipboard</text>
    <text class="a cap4" x="400" y="330">Paste anywhere with <tspan fill="#c084fc">Ctrl + V</tspan></text>
  </g>
  <text x="400" y="358" text-anchor="middle" class="ui" font-size="13" fill="#64748b">A single tap does nothing: Right Alt keeps working normally</text>
</svg>
