<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" width="640" height="416" role="img" aria-label="Tray menu: Scan text on screen, How to use, Change shortcut, Pause, Start with Windows, Sound when copied, Change Gemini API key, Exit">
  <style>
    .ui { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .hl { animation: hl 11s infinite ease-in-out; }
    @keyframes hl { 0%,7% {transform: translateY(0)} 12%,21% {transform: translateY(36px)} 26%,35% {transform: translateY(72px)} 40%,49% {transform: translateY(126px)} 54%,63% {transform: translateY(162px)} 68%,77% {transform: translateY(198px)} 82%,91% {transform: translateY(234px)} 96%,100% {transform: translateY(0)} }
    @media (prefers-reduced-motion: reduce) { .hl { animation: none; } }
  </style>
  <rect width="640" height="416" rx="16" fill="#0f172a"/>

  <rect x="24" y="20" width="290" height="356" rx="10" fill="#2b2b2b" stroke="#3f3f3f"/>
  <text x="44" y="50" class="ui" font-size="14" fill="#8a8a8a">QuickNotes</text>
  <rect x="32" y="62" width="274" height="1" fill="#454545"/>
  <rect class="hl" x="30" y="70" width="278" height="32" rx="6" fill="#3d3d3d"/>
  <g class="ui" font-size="14" fill="#f3f3f3">
    <text x="68" y="91" font-weight="700">Scan text on screen</text>
    <text x="68" y="127">How to use</text>
    <text x="68" y="163">Change shortcut…</text>
    <rect x="32" y="180" width="274" height="1" fill="#454545"/>
    <text x="68" y="217">Pause</text>
    <text x="44" y="253">✓</text><text x="68" y="253">Start with Windows</text>
    <text x="44" y="289">✓</text><text x="68" y="289">Sound when copied</text>
    <text x="68" y="325">Change Gemini API key</text>
    <rect x="32" y="338" width="274" height="1" fill="#454545"/>
    <text x="68" y="364">Exit</text>
  </g>

  <!-- Tray icon -->
  <rect x="24" y="386" width="290" height="22" rx="6" fill="#1c1c1c"/>
  <g fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round">
    <path d="M262 393 v-2 a2 2 0 0 1 2 -2 h2 M272 389 h2 a2 2 0 0 1 2 2 v2 M276 401 v2 a2 2 0 0 1 -2 2 h-2 M266 405 h-2 a2 2 0 0 1 -2 -2 v-2"/>
    <path d="M266 395 h6 M266 399 h4"/>
  </g>
  <path d="M269 384 v-4" stroke="#94a3b8" stroke-width="1.5"/>

  <g class="ui" font-size="13.5" fill="#cbd5e1">
    <text x="336" y="91"><tspan font-weight="700" fill="#f8fafc">Scan</tspan> — same as your shortcut.</text>
    <text x="336" y="109">Double-click the tray icon too</text>
    <text x="336" y="127"><tspan font-weight="700" fill="#f8fafc">How to use</tspan> — quick guide</text>
    <text x="336" y="163"><tspan font-weight="700" fill="#f8fafc">Change shortcut</tspan> — any key or combo</text>
    <text x="336" y="217"><tspan font-weight="700" fill="#f8fafc">Pause</tspan> — your keys fully normal</text>
    <text x="336" y="253"><tspan font-weight="700" fill="#f8fafc">Start with Windows</tspan> — at login</text>
    <text x="336" y="289"><tspan font-weight="700" fill="#f8fafc">Sound</tspan> — soft chime when copied</text>
    <text x="336" y="325"><tspan font-weight="700" fill="#f8fafc">Change key</tspan> — paste a new one</text>
  </g>
</svg>
