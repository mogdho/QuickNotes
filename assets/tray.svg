<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 308" width="640" height="308" role="img" aria-label="Tray menu: Scan text on screen, Pause, Start with Windows, Change Gemini API key, Exit">
  <style>
    .ui { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .hl { animation: hl 8s infinite ease-in-out; }
    @keyframes hl { 0%,12% {transform: translateY(0)} 20%,36% {transform: translateY(54px)} 44%,60% {transform: translateY(90px)} 68%,86% {transform: translateY(126px)} 94%,100% {transform: translateY(0)} }
    @media (prefers-reduced-motion: reduce) { .hl { animation: none; } }
  </style>
  <rect width="640" height="308" rx="16" fill="#0f172a"/>

  <rect x="24" y="20" width="290" height="248" rx="10" fill="#2b2b2b" stroke="#3f3f3f"/>
  <text x="44" y="50" class="ui" font-size="14" fill="#8a8a8a">QuickNotes</text>
  <rect x="32" y="62" width="274" height="1" fill="#454545"/>
  <rect class="hl" x="30" y="70" width="278" height="32" rx="6" fill="#3d3d3d"/>
  <g class="ui" font-size="14" fill="#f3f3f3">
    <text x="68" y="91" font-weight="700">Scan text on screen</text>
    <rect x="32" y="108" width="274" height="1" fill="#454545"/>
    <text x="68" y="145">Pause</text>
    <text x="44" y="181">✓</text><text x="68" y="181">Start with Windows</text>
    <text x="68" y="217">Change Gemini API key</text>
    <rect x="32" y="230" width="274" height="1" fill="#454545"/>
    <text x="68" y="256">Exit</text>
  </g>

  <!-- Tray icon -->
  <rect x="24" y="278" width="290" height="22" rx="6" fill="#1c1c1c"/>
  <g fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round">
    <path d="M262 285 v-2 a2 2 0 0 1 2 -2 h2 M272 281 h2 a2 2 0 0 1 2 2 v2 M276 293 v2 a2 2 0 0 1 -2 2 h-2 M266 297 h-2 a2 2 0 0 1 -2 -2 v-2"/>
    <path d="M266 287 h6 M266 291 h4"/>
  </g>
  <path d="M269 276 v-4" stroke="#94a3b8" stroke-width="1.5"/>

  <g class="ui" font-size="13.5" fill="#cbd5e1">
    <text x="336" y="91"><tspan font-weight="700" fill="#f8fafc">Scan</tspan> — same as double-tap.</text>
    <text x="336" y="109">Double-click the tray icon too</text>
    <text x="336" y="145"><tspan font-weight="700" fill="#f8fafc">Pause</tspan> — Right Alt fully normal</text>
    <text x="336" y="181"><tspan font-weight="700" fill="#f8fafc">Start with Windows</tspan> — at login</text>
    <text x="336" y="217"><tspan font-weight="700" fill="#f8fafc">Change key</tspan> — paste a new one</text>
  </g>
</svg>
